[project]
name = "astroengine"
version = "0.1.0"
description = "Personal astrology + numerology data engine (natal calculation layer)"
requires-python = ">=3.10"
dependencies = [
    "pyswisseph>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astroengine*"]
